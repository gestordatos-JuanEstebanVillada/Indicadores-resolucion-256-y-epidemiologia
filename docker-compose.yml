services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: indicadores-backend:local
    container_name: indicadores-backend
    ports:
      - "${BACKEND_HOST_PORT:-8007}:8007"
    env_file:
      - .env
    environment:
      SCSE_DB_USER: ${SCSE_DB_USER}
      SCSE_DB_PASSWD: ${SCSE_DB_PASSWD}
      SCSE_DB_IP: ${SCSE_DB_IP}
      SCSE_DB_PORT: ${SCSE_DB_PORT:-1521}
      SCSE_DB_DATABASE: ${SCSE_DB_DATABASE}
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8007/health', timeout=5)",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_ORIGIN: ${VITE_API_ORIGIN:-http://127.0.0.1:8007}
        VITE_TABLEAU_CLIENT_ID: ${VITE_TABLEAU_CLIENT_ID:-}
        VITE_TABLEAU_SECRET_ID: ${VITE_TABLEAU_SECRET_ID:-}
        VITE_TABLEAU_SECRET_VALUE: ${VITE_TABLEAU_SECRET_VALUE:-}
        VITE_TABLEAU_USERNAME: ${VITE_TABLEAU_USERNAME:-}
    image: indicadores-frontend:local
    container_name: indicadores-frontend
    ports:
      - "${FRONTEND_HOST_PORT:-5173}:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

# API: http://<servidor>:8007/health  (NO usa el puerto 8000 en el host)
# Frontend: http://<servidor>:5173  (cambiar FRONTEND_HOST_PORT si 5173 está ocupado)
#
# Tras actualizar este archivo en el servidor:
#   docker compose down --remove-orphans
#   docker rm -f indicadores-backend indicadores-frontend 2>/dev/null || true
#   docker compose up -d --build
#
# Si aún ves "Bind for 0.0.0.0:8000", hay un docker-compose.override.yml viejo
# o otro contenedor:  docker ps --format '{{.Names}} {{.Ports}}' | grep 8000

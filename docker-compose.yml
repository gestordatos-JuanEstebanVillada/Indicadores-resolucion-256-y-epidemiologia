services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: indicadores-backend:local
    container_name: indicadores-backend
    # Host:contenedor — el proceso uvicorn escucha 8007 DENTRO del contenedor
    ports:
      - "${BACKEND_HOST_PORT:-8008}:8007"
    env_file:
      - .env
    environment:
      SCSE_DB_USER: ${SCSE_DB_USER}
      SCSE_DB_PASSWD: ${SCSE_DB_PASSWD}
      SCSE_DB_IP: ${SCSE_DB_IP}
      SCSE_DB_PORT: ${SCSE_DB_PORT:-1521}
      SCSE_DB_DATABASE: ${SCSE_DB_DATABASE}
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8007/health', timeout=5)",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_ORIGIN: ${VITE_API_ORIGIN:-http://127.0.0.1:8008}
        VITE_TABLEAU_CLIENT_ID: ${VITE_TABLEAU_CLIENT_ID:-}
        VITE_TABLEAU_SECRET_ID: ${VITE_TABLEAU_SECRET_ID:-}
        VITE_TABLEAU_SECRET_VALUE: ${VITE_TABLEAU_SECRET_VALUE:-}
        VITE_TABLEAU_USERNAME: ${VITE_TABLEAU_USERNAME:-}
    image: indicadores-frontend:local
    container_name: indicadores-frontend
    ports:
      - "${FRONTEND_HOST_PORT:-5180}:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

# Puertos ocupados en el VM (ej.): 8000, 8002, 8004, 8007, 5173, 5174, 5175, 9443.
# Defaults: API host 8008, frontend host 5180. Libre en .env: FRONTEND_HOST_PORT=5181
# Comprobar libres:  ss -tln | grep -E ':(517|800|808)'
#
# ¿Quieres el API en 8007 en el host? Ese puerto suele ser indicadores-backend viejo:
#   docker stop indicadores-backend && docker rm indicadores-backend
#   En .env: BACKEND_HOST_PORT=8007 y VITE_API_ORIGIN=http://<IP>:8007
#   docker compose build --no-cache frontend && docker compose up -d
#
# VITE_API_ORIGIN debe coincidir con BACKEND_HOST_PORT (IP del VM + puerto host).

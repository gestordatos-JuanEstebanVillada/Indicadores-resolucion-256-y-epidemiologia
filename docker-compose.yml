services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: indicadores-backend:local
    container_name: indicadores-backend
    ports:
      - "8007:8000"
    env_file:
      - .env
    environment:
      SCSE_DB_USER: ${SCSE_DB_USER}
      SCSE_DB_PASSWD: ${SCSE_DB_PASSWD}
      SCSE_DB_IP: ${SCSE_DB_IP}
      SCSE_DB_PORT: ${SCSE_DB_PORT:-1521}
      SCSE_DB_DATABASE: ${SCSE_DB_DATABASE}
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_ORIGIN: ${VITE_API_ORIGIN:-http://127.0.0.1:8007}
        VITE_TABLEAU_CLIENT_ID: ${VITE_TABLEAU_CLIENT_ID:-}
        VITE_TABLEAU_SECRET_ID: ${VITE_TABLEAU_SECRET_ID:-}
        VITE_TABLEAU_SECRET_VALUE: ${VITE_TABLEAU_SECRET_VALUE:-}
        VITE_TABLEAU_USERNAME: ${VITE_TABLEAU_USERNAME:-}
    image: indicadores-frontend:local
    container_name: indicadores-frontend
    ports:
      - "5173:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

# API publicada en el host: http://<servidor>:8007  (contenedor escucha 8000)
# Frontend: http://<servidor>:5173
#
# En el servidor Linux, define en .env la IP/host real del backend, por ejemplo:
#   VITE_API_ORIGIN=http://160.2.1.80:8007
#
# Si falla el build con "lookup auth.docker.io ... i/o timeout", el VM no llega a
# Docker Hub (DNS/firewall). Prueba: ping auth.docker.io, DNS 8.8.8.8, o importar
# imágenes con docker load desde otra máquina con internet.

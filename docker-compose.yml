services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: indicadores-backend:local
    container_name: indicadores-backend
    ports:
      - "${BACKEND_HOST_PORT:-8008}:${BACKEND_CONTAINER_PORT:-8008}"
    env_file:
      - .env
      - frontend/.env
    environment:
      BACKEND_PORT: ${BACKEND_CONTAINER_PORT:-8008}
      SCSE_DB_USER: ${SCSE_DB_USER}
      SCSE_DB_PASSWD: ${SCSE_DB_PASSWD}
      SCSE_DB_IP: ${SCSE_DB_IP}
      SCSE_DB_PORT: ${SCSE_DB_PORT:-1521}
      SCSE_DB_DATABASE: ${SCSE_DB_DATABASE}
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8008/health', timeout=5)",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Vacío = peticiones relativas (/api) vía nginx al servicio backend
        VITE_API_ORIGIN: ${VITE_API_ORIGIN:-}
    image: indicadores-frontend:local
    container_name: indicadores-frontend
    ports:
      - "${FRONTEND_HOST_PORT:-5180}:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

# Acceso: http://<IP-del-servidor>:5180 (frontend). API en el mismo origen (/api).
# API directa (opcional): http://<IP>:8008/docs
#
# Variables opcionales en .env:
#   FRONTEND_HOST_PORT=5180
#   BACKEND_HOST_PORT=8008
#   BACKEND_CONTAINER_PORT=8008
# Solo si desarrollas el front fuera de Docker contra un API en otra URL:
#   VITE_API_ORIGIN=http://160.2.1.22:8008
